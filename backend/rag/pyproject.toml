[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindcare-rag"
version = "1.0.0"
description = "RAG system for MindCare mental health app"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Flask==3.0.0",
    "Flask-CORS==4.0.0",
    "python-dotenv==1.0.0",
    "gunicorn==21.2.0",
    "python-docx==0.8.11",
    "PyPDF2==4.0.1",
    "numpy==1.24.3",
    "scikit-learn==1.3.2",
    "sentence-transformers==2.2.2",
    "faiss-cpu==1.7.4",
    "openai==1.12.0",
    "requests==2.31.0",
    "firebase-admin==6.2.0",
]
